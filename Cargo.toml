[package]
name = "popupstory"
version = "0.1.0"
edition = "2024"
description = "PopUpStory: turn a video into a 3D papercraft pop-up book (CLI + WebAssembly core)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "popupstory"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4", features = ["derive"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.25", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
